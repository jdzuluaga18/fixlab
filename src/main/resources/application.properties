# ── Base de datos SQLite ──────────────────────────────────────────────────────
# Se guarda en ~/.fixlab/demo.db para que siempre se encuentre
# independientemente del directorio desde el que se lance la app.
spring.datasource.url=jdbc:sqlite:${user.home}/.fixlab/demo.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# ── Spring Boot (app de escritorio, sin servidor web) ─────────────────────────
spring.main.web-application-type=none

# ── Logging (reducir ruido en consola) ───────────────────────────────────────
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
